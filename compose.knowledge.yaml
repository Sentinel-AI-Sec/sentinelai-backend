# The knowledge stack: Qdrant plus the query-time embedding service (SEC-22 / SEC-48).
#
#     docker compose -f compose.knowledge.yaml up -d
#
# This is the half of SentinelAI that is NOT code — a vector database and a 2.2 GB model —
# and the reason retrieval historically only worked on the machine that happened to have both.
# Bringing it up is one command on any machine with Docker.
#
# It deliberately does NOT include the API. The backend runs from your IDE against these two,
# which is what you want while developing; compose.yaml builds the API image for the cases
# where you want the whole thing containerised.
#
# Ports match what the backend expects with no configuration at all:
#   6333  Qdrant REST   — curl, the dashboard, snapshots
#   6334  Qdrant gRPC   — what the .NET client speaks. NOT 6333.
#   7860  embedder      — /health /warmup /embed /parity
#
# After `up`, the corpus is still empty. Restoring one is scripts/corpus-restore — see SETUP.md.

name: sentinelai-knowledge

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: sentinelai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Named volume, so the corpus survives `down` and you restore it once rather than
      # per session. `docker compose down -v` is what actually discards it.
      - qdrant-storage:/qdrant/storage
      # Snapshots land here so corpus-snapshot / corpus-restore can reach them from the host.
      - ./.corpus/snapshots:/qdrant/snapshots
    environment:
      QDRANT__SERVICE__ENABLE_STATIC_CONTENT: "true"
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots
    healthcheck:
      # /readyz, not /healthz: Qdrant answers healthz before collections are loadable, and a
      # restore that starts in that window fails in a way that looks like a corrupt snapshot.
      # bash explicitly: /dev/tcp is a bash builtin and CMD-SHELL runs dash, which fails
      # with "cannot create /dev/tcp/..." and marks a healthy Qdrant unhealthy forever.
      # The image ships no curl and no wget, so this is the check available to us.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  embedder:
    # Built from the sibling knowledge repo, which owns the model and the ingest that used it.
    # One definition of the embedder, not two — that is the whole of SEC-48's invariant.
    build:
      context: ../sentinelai-knowledge
      dockerfile: Dockerfile
    image: sentinelai-embedder:local
    container_name: sentinelai-embedder
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      # Mounted at the image's OWN cache path, not a new one. The Dockerfile creates user
      # app (uid 1000), chowns /home/app, and runs as that user. A named volume mounted
      # anywhere else is created owned by root, and the first download dies with
      # "PermissionError at /cache/huggingface" -- which reads like a network fault.
      # Mounting over a path that exists in the image inherits its ownership instead.
      #
      # Purpose unchanged: weights survive a rebuild rather than re-downloading 2.2 GB.
      - embedder-cache:/home/app/.cache/huggingface
    healthcheck:
      # A long start_period on purpose: the model loads lazily on first use and a cold CPU
      # load takes minutes. Marking it unhealthy before then would restart it forever.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:7860/health',timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

    # Optional. The exact-filter arm needs no model at all, so a machine that only wants
    # identifier lookups can skip this entirely:
    #     docker compose -f compose.knowledge.yaml up -d qdrant
    profiles: ["full", "embedder"]

volumes:
  qdrant-storage:
  embedder-cache:
