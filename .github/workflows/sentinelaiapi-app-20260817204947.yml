name: Build and deploy .NET application to container app sentinelaiapi-app-20260817204947
on:
  push:
    branches:
    - main
permissions:
  id-token: write
  contents: read
env:
  CONTAINER_APP_CONTAINER_NAME: sentinelaiapi
  CONTAINER_APP_NAME: sentinelaiapi-app-20260817204947
  CONTAINER_APP_RESOURCE_GROUP_NAME: Sentinal_DEP
  CONTAINER_REGISTRY_LOGIN_SERVER: sentinelaiapi20260817214050.azurecr.io
  DOTNET_CORE_VERSION: 10.0.x
  PROJECT_NAME_FOR_DOCKER: sentinelai.api
  WORKING_DIRECTORY: src/SentinelAI.Api
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout to the branch
      uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-quality: preview
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Log in to container registry
      uses: azure/docker-login@v2
      with:
        login-server: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.SentinelAIApi20260817214050_USERNAME_7F7E }}
        password: ${{ secrets.SentinelAIApi20260817214050_PASSWORD_7F7E }}
    - name: Build and push container image to registry
      run: dotnet publish "${{ env.WORKING_DIRECTORY }}" -c Release -r linux-x64 -p:PublishProfile=DefaultContainer -p:ContainerImageTag=${{ github.sha }} --no-self-contained -p:ContainerRegistry=${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }} -bl
    - name: Upload binlog for investigation
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: binlog
        path: msbuild.binlog
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ vars.sentinelaiapi_app_20260817204947_CLIENT_ID_23A4 }}
        tenant-id: ${{ vars.sentinelaiapi_app_20260817204947_TENANT_ID_7F7E }}
        subscription-id: ${{ vars.sentinelaiapi_app_20260817204947_SUBSCRIPTION_ID_7F7E }}
    - name: Deploy to containerapp
      uses: azure/CLI@v2
      with:
        inlineScript: >
          az config set extension.use_dynamic_install=yes_without_prompt

          az containerapp registry set --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.CONTAINER_APP_RESOURCE_GROUP_NAME }} --server ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }} --username ${{ secrets.SentinelAIApi20260817214050_USERNAME_7F7E }} --password ${{ secrets.SentinelAIApi20260817214050_PASSWORD_7F7E }}

          az containerapp update --name ${{ env.CONTAINER_APP_NAME }} --container-name ${{ env.CONTAINER_APP_CONTAINER_NAME }} --resource-group ${{ env.CONTAINER_APP_RESOURCE_GROUP_NAME }} --image ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}:${{ github.sha }}
    - name: logout
      run: >
        az logout
